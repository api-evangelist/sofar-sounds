name: Sofar Sounds
description: Sofar Sounds curates secret, intimate live-music gigs in living rooms, small venues, and
  unexpected spaces in hundreds of cities around the world. The company connects independent and emerging
  artists with attentive local audiences through a mobile-first ticketing and events platform, and works
  with hosts who lend their spaces for the shows. Sofar operates a consumer-facing website and apps rather
  than a public developer program; probing its surface confirmed no documented public API, developer portal,
  SDKs, or OpenAPI. It runs a real GitHub organization (github.com/sofarsounds) of internal engineering
  repositories, and its production backend is served from api.sofarsounds.com (Heroku), but neither exposes
  a published, documented API for third-party developers.
